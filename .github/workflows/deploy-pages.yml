name: Deploy downloadable game to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Chromebook and Windows editions
        run: npm run package:win

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package downloads
        run: |
          mkdir -p ../_site/downloads ../_release
          cp ../docs/index.html ../_site/index.html
          sed -i "s#__WINDOWS_DOWNLOAD_URL__#https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Dynamite-Doll-Wrestling-windows-x64.zip#" ../_site/index.html
          ! grep -q '__WINDOWS_DOWNLOAD_URL__' ../_site/index.html
          grep -qzP '</style>\s*</head>\s*<body>' ../_site/index.html
          grep -q 'downloads/Dynamite-Doll-Wrestling-chromebook.zip' ../_site/index.html
          cat > dist/chromebook/README.txt <<'EOF'
          Dynamite Doll Wrestling 3D - Chromebook edition

          1. Extract this ZIP file in the Chromebook Files app.
          2. Open index.html in Chrome to play offline.

          Graphics start on Medium. Choose Low in Settings on older Chromebooks.
          Controls: arrow keys move, A/Space strike, S grapple, D signature,
          F pin, Esc pause. Gamepads and touchscreens are supported.
          EOF
          (cd dist/chromebook && zip -qr -9 ../../../_site/downloads/Dynamite-Doll-Wrestling-chromebook.zip .)
          APP_DIR="out/Dynamite Doll Wrestling-win32-x64"
          test -f "$APP_DIR/DynamiteDollWrestling.exe"
          cat > "$APP_DIR/README.txt" <<'EOF'
          Dynamite Doll Wrestling 3D - Windows x64 edition

          1. Extract this ZIP file to a folder.
          2. Run DynamiteDollWrestling.exe. It opens full screen with Ultra
             graphics (up to 4K internal resolution). Press F11 or Alt+Enter to
             toggle full screen and change graphics quality in Settings.

          This is a portable app: nothing is installed. The app is not
          code-signed, so Windows SmartScreen may ask you to confirm with
          "More info" > "Run anyway".

          Controls: arrow keys move, A/Space strike, S grapple, D signature,
          F pin, Esc pause. Xbox and PlayStation controllers are supported.
          EOF
          (cd "$APP_DIR" && zip -qr -9 ../../../_release/Dynamite-Doll-Wrestling-windows-x64.zip .)
          ls -la ../_site/downloads ../_release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: _release/Dynamite-Doll-Wrestling-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The Windows app is larger than the 100 MB per-file limit for GitHub Pages,
  # so it is published as a release asset that the downloads page links to.
  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: windows-x64

      - name: Publish Windows release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Dynamite-Doll-Wrestling-windows-x64.zip --clobber
          else
            gh release create "$TAG" Dynamite-Doll-Wrestling-windows-x64.zip \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Dynamite Doll Wrestling 3D $TAG" \
              --notes "Windows x64 desktop edition. Extract the ZIP and run DynamiteDollWrestling.exe. The Chromebook edition is on the GitHub Pages downloads page."
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, release]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
