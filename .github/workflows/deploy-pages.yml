name: Deploy downloadable game to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows game
        run: dotnet publish "Dynamite Doll Wrestling.csproj" --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/downloads _chromebook/js
          cp docs/index.html _site/index.html
          sed 's#<a href="./">Back to downloads</a>#Offline Chromebook edition#' docs/play.html > _chromebook/index.html
          cp wwwroot/js/wrestling-renderer.js _chromebook/js/wrestling-renderer.js
          cat > _chromebook/README.txt <<'EOF'
          Dynamite Doll Wrestling for Chromebook

          1. Extract this ZIP file in the Chromebook Files app.
          2. Open index.html in Chrome to play offline.

          The game runs locally in your browser and does not need an installation
          or internet connection. Keyboard and on-screen controls are available.
          MetaMask rewards are not available in this browser edition.
          EOF
          (cd _chromebook && zip -qr ../_site/downloads/Dynamite-Doll-Wrestling-chromebook.zip .)
          mkdir -p _ultra/js
          sed -e 's#Browser edition &mdash; works on Chromebooks and any modern browser. <a href="./">Back to downloads</a>#Windows Ultra Edition \&mdash; native resolution up to 4K.#' \
              -e 's#data-default="classic"#data-default="ultra"#' docs/play.html > _ultra/index.html
          grep -q 'data-default="ultra"' _ultra/index.html
          cp wwwroot/js/wrestling-renderer.js _ultra/js/wrestling-renderer.js
          printf '%s\r\n' \
            '@echo off' \
            'rem Opens the Ultra Edition full screen in Microsoft Edge (press F11 to leave full screen).' \
            'start "" msedge --start-fullscreen "%~dp0index.html"' \
            'if errorlevel 1 start "" "%~dp0index.html"' \
            > "_ultra/Play Dynamite Doll Wrestling Ultra.cmd"
          cat > _ultra/README.txt <<'EOF'
          Dynamite Doll Wrestling - Windows Ultra Edition

          1. Extract this ZIP file to a folder.
          2. Double-click "Play Dynamite Doll Wrestling Ultra.cmd" to play full
             screen in Microsoft Edge, or open index.html in any modern browser.

          Ultra graphics render the ring at your display's native resolution (up
          to 3840x2160 / 4K), at your monitor's full refresh rate, with arena
          lighting, shadows, particle effects and camera shake. Graphics can be
          switched back to Classic from the Graphics menu.

          Recommended: Windows 11 64-bit, a high-refresh-rate 1440p or 4K
          display, and hardware graphics acceleration enabled in the browser.
          The game is 2D and does not use DirectX 12 ray tracing.

          The game runs locally and does not need an installation or internet
          connection. MetaMask rewards are not available in this edition.
          EOF
          (cd _ultra && zip -qr ../_site/downloads/Dynamite-Doll-Wrestling-windows-ultra.zip .)
          cat > publish/appsettings.Production.json <<'EOF'
          {
            "ConnectionStrings": {
              "DefaultConnection": ""
            }
          }
          EOF
          cat > publish/README.txt <<'EOF'
          Dynamite Doll Wrestling for Windows (x64)

          1. Extract this ZIP file to a folder.
          2. Run Dynamite_Doll_Wrestling.exe.
          3. Open http://localhost:5000 in a modern browser.

          The game server runs locally on your computer. Keep its console window
          open while playing. MetaMask reward claims require a separately
          configured reward issuer and are not enabled in this download.
          EOF
          (cd publish && zip -qr ../_site/downloads/Dynamite-Doll-Wrestling-windows-x64.zip .)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
